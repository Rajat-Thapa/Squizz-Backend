services:
  subscription-service:
    build:
      context: .
      args: { SERVICE: subscription-service }
    # Published so the frontend repo's Vite dev server can proxy /api here.
    ports: ["127.0.0.1:8081:8081"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/squizz
      DATABASE_USER: squizz
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Copy .env.example to .env first}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:5173}
      NOTIFICATION_URL: http://notification-service:8082
    depends_on:
      postgres: { condition: service_healthy }
      notification-service: { condition: service_started }
    restart: unless-stopped
  notification-service:
    build:
      context: .
      args: { SERVICE: notification-service }
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-Squizz <hello@squizz.test>}
    depends_on: [mailpit]
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: squizz
      POSTGRES_USER: squizz
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes: ["squizz-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squizz -d squizz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
    restart: unless-stopped
networks:
  default:
    name: squizz
volumes:
  squizz-data:
